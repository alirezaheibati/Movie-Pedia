<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="src/styles.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script type="module" src="src/js/app.js"></script>
    <title>Movie Pedia</title>
  </head>
  <body>
    <header
      class="h-screen w-screen flex justify-center items-center bg-[url('/src/assets/header-bg.jpg')] bg-cover bg-no-repeat bg-right-bottom  relative"
    >
      <!-- header menu -->
      <div
        class="absolute left-0 right-0 top-0 flex justify-between items-center py-4 px-4 sm:px-5 md:px-6 md:py-5 lg:px-8 bg-gradient-to-b from-[#041023] to-transparent"
      >
        <h1 class="text-[#ea2a49] text-3xl md:text-4xl font-lobster">
          Cinema<span class="text-slate-200">Graphy</span>
        </h1>
        <img src="src/assets/logo.png" alt="logo" class="h-16" />
      </div>
      <!-- search box -->
      <form class="bg-black/30 px-6 py-4 rounded-2xl w-[90%] sm:w-[500px]">
        <p class="text-slate-200 text-center text-3xl mb-2 font-lobster">
          Search for <span class="text-[#ea2a49]">movies</span>
          <p class="text-slate-200 text-center mb-4">click and search for movies or series</p>
        </p>
        <div
          class="relative h-12 w-12 transition-[width] duration-200 ease-linear rounded-full flex mx-auto bg-slate-50 justify-center items-center border-[3px] border-solid border-[#ea2a49]"
          id="search-box-container"
        >
          <input
            type="text"
            id="btn"
            class="bg-slate-50 h-full w-full rounded-full outline-none pl-4 text-base placeholder:text-slate-800"
            placeholder="Search For Movies"
          />
          <button
            type="button"
            class="w-[42px] h-[42px] flex rounded-full bg-slate-50 justify-center items-center absolute right-0 top-0 overflow-hidden"
          >
            <img
              src="src/assets/logo.png"
              alt=""
              class="w-8 h-8 translate-x-[3px]"
            />
          </button>
        </div>
        <div class="text-slate-50 flex justify-center items-center gap-3 mt-4">
          <button>
            <i class="fa-solid fa-video text-lg text-[#ea2a49]" title="movies"></i>
          </button>
          <button>
            <i class="fa-solid fa-tv " title="series"></i>
          </button>
        </div>
      </form>
    </header>
    <!-- <img src="src/assets/header-bg.jpg" alt="hei" /> -->
  </body>
</html>
