<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="src/styles.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script type="module" src="src/js/app.js"></script>
    <title>Movie Pedia</title>
  </head>
  <body class="bg-[#1C1C22] overflow-x-hidden">
    <!-- spinner -->
    <div
    class="spinner h-screen w-screen left-0 top-0 z-30 hidden fixed justify-center items-center bg-black/80"
    id="spinner-container"
  >
    <div
      class="w-32 h-32 border-[10px] animate-spin border-x-red-700 border-y-transparent rounded-full"
    ></div>
  </div>
          <!-- message box -->
          <div
          class="message-box-container hidden h-screen w-screen left-0 top-0 z-30 fixed justify-center items-center bg-black/80"
          id="message-container">
        </div>
  <!-- movie info overlay -->
    <div class=" hidden fixed top-0 left-0 w-screen z-20 bg-black h-screen">
      <!-- close btn -->
      <button class="absolute cursor-pointer z-50 bg-[#ED145B] top-3 left-3 w-8 h-8 rounded-full text-slate-50"
      id="overlay-close-btn">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <div id="overlay-content-container">
    </div>
    </div>
    <header
      class="h-screen flex justify-center items-center bg-[url('/src/assets/header-bg.jpg')] bg-cover bg-no-repeat bg-right-bottom  relative"
    >
      <!-- header menu -->
      <div
        class="absolute left-0 right-0 top-0 flex justify-between items-center py-4 px-4 sm:px-5 md:px-6 md:py-5 lg:px-8 bg-gradient-to-b from-[#041023] to-transparent"
      >
        <h1 class="text-[#ea2a49] text-3xl md:text-4xl font-lobster">
          Cinema<span class="text-slate-200">Graphy</span>
        </h1>
        <img src="src/assets/logo.png" alt="logo" class="h-16" />
      </div>
      <!-- search box -->
       <div class="bg-black/30 rounded-2xl w-[90%] sm:w-[500px] pb-4">
      <form class=" px-6 py-4 w-full" 
      id="search-box-form">
        <p class="text-slate-200 text-center text-3xl mb-2 font-lobster">
          Search for <span class="text-[#ea2a49]">movies</span>
          <p class="text-slate-200 text-center mb-4">click and search for movies or series</p>
        </p>
        <div
          class="relative h-12 w-12 transition-[width] duration-200 ease-linear rounded-full flex mx-auto bg-slate-50 justify-center items-center border-[3px] border-solid border-[#ea2a49]"
          id="search-box-container"
        >
          <input
            type="text"
            id="movie-search-input"
            class="bg-slate-50 h-full w-full rounded-full outline-none pl-4 text-base placeholder:text-slate-800"
            placeholder="Search For Movies"
          />
          <button
            type="button"
            id="movie-search-btn"
            class="w-[42px] h-[42px] flex rounded-full bg-slate-50 justify-center items-center absolute right-0 top-0 overflow-hidden"
          >
            <img
              src="src/assets/logo.png"
              alt=""
              class="w-8 h-8 translate-x-[3px]"
            />
          </button>
        </div>
      </form>
      <div class="text-slate-50 flex justify-center items-center gap-3" id="search-type-container">
        <button class="type-toggler-btn movie-toggler text-[#ea2a49]">
          <i class="fa-solid fa-video text-lg" title="movies"></i>
        </button>
        <button class="type-toggler-btn series-toggler text-sm">
          <i class="fa-solid fa-tv " title="series"></i>
        </button>
      </div>
    </div>
    </header>
    <!-- content section -->
    <section class="py-8 md:py-10 md:h-screen md:flex md:flex-col md:justify-between">
      <div class="px-4">
        <h2 class="font-lobster text-3xl text-slate-50">Top <span class="text-[#ea2a49]">10</span> </h2>
        <hr class="h-1 bg-[#ea2a49] border-[#ea2a49] mt-4 mb-8">
      </div>
      <!-- top ten movie slide container -->
      <div class="w-[1000%] md:w-[500%] lg:w-[333%] xl:w-[250%] h-[400px] flex justify-around -translate-x-[0%] transition-[transform] duration-200 ease-linear"
      id="slider-container">
         
      </div>
      <!-- circles -->
       <ul class=" flex justify-center items-center py-5 gap-2 [&_li]:h-3 [&_li]:rounded-full [&_li]:transition[width] [&_li]:duration-100 [&_li]:ease-linear " id="top-ten-slider">
        <li data-slide-to="0" class="slider-btn bg-[#ea2a49] w-6 "></li>
        <li data-slide-to="1" class="slider-btn bg-slate-300 w-3 "></li>
        <li data-slide-to="2" class="slider-btn bg-slate-300 w-3 "></li>
        <li data-slide-to="3" class="slider-btn bg-slate-300 w-3 "></li>
        <li data-slide-to="4" class="slider-btn bg-slate-300 w-3 "></li>
        <li data-slide-to="5" class="slider-btn bg-slate-300 w-3 "></li>
        <li data-slide-to="6" class="slider-btn bg-slate-300 w-3 "></li>
        <li data-slide-to="7" class="slider-btn bg-slate-300 w-3 xl:hidden"></li>
        <li data-slide-to="8" class="slider-btn bg-slate-300 w-3  lg:hidden"></li>
        <li data-slide-to="9" class="slider-btn bg-slate-300 w-3  md:hidden"></li>
       </ul>
    </section>
<!-- fetch movies section -->
 <section class="py-8 text-slate-50">
  <!-- tabs -->
  <div class="px-4">
    <ul class="flex gap-4 text-xl md:text-2xl font-lobster  border-b-4 border-b-[#ea2a49]" id="tabs-container-ul">
      <li class="py-2 text-[#ea2a49] tab-item" data-tab-identifier="search"><button>Search Results</button></li>
      <li class="py-2 tab-item" data-tab-identifier="favorite"><button class="">Favorites</button></li>
    </ul>
    <!-- search results tab-->
    <div class="py-4 lg:flex lg:justify-between lg:items-stretch lg:flex-wrap lg:gap-[1%]" 
    id="search-results-tab">
       <p><i class="fa-solid fa-bolt"></i> Search for movies to see the results here.</p> 
    </div>
        <!-- favorites tab -->
        <div class="py-4 hidden lg:justify-between lg:items-stretch lg:flex-wrap lg:gap-[1%]" 
        id="favorite-movies-tab">
           <p><i class="fa-solid fa-bolt"></i> There is no favorite movie. Please find your favorite movies and bookmark them.</p> 
        </div>
  </div>
 </section>
 <footer>
  <hr>
<p class="text-slate-200 text-center my-4">@ 2024 - All Rights Reserved.</p>
 </footer>
  </body>
</html>
